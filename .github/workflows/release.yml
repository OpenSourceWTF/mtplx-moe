name: build fork artifacts

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      ref:
        description: "Git ref to build"
        required: true
        default: "main"

permissions:
  contents: read

jobs:
  build-artifacts:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v7.0.0
        with:
          ref: ${{ github.event.inputs.ref || github.ref }}
      - uses: actions/setup-python@v6.3.0
        with:
          python-version: "3.11"
      - run: python -m pip install -U pip build twine
      - name: Set reproducible build epoch
        run: echo "SOURCE_DATE_EPOCH=$(git show -s --format=%ct HEAD)" >> "$GITHUB_ENV"
      - run: python -m build
      - run: python -m twine check dist/*
      - run: scripts/fresh_venv_smoke.sh
      - uses: actions/upload-artifact@v7.0.1
        with:
          name: dist
          path: dist/*
